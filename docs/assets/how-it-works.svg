<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 312" width="880" height="312" role="img" aria-labelledby="t d">
  <title id="t">How jev-map adds Jev's links</title>
  <desc id="d">For a function in the map, keyword search picks three likely tests. Jev scores each function and test pair from 0 to 1. A pair at 0.8 or higher is added to the map as an inferred link, with a receipt of the exact request. A pair under 0.8 is not added, and the test may still run the function. Structural links come from reading the code, with no model and none of your code executed.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .panel { fill: #FFFFFF; stroke: #D0D7DE; }
    .box   { fill: #F6F8FA; stroke: #8C959F; stroke-width: 1.2; }
    .tbox  { fill: #FFFFFF; stroke: #BF6A2B; stroke-width: 2; }
    .h     { font-size: 15px; font-weight: 600; fill: #1F2328; }
    .s     { font-size: 13px; fill: #59636E; }
    .cond  { font-size: 12px; font-weight: 600; letter-spacing: 0.02em; fill: #59636E; }
    .acc   { fill: #A0521C; }
    .line  { stroke: #8C959F; stroke-width: 1.8; fill: none; }
    .head  { fill: #8C959F; }
    .ok    { fill: #1A7F37; }
    .no    { fill: #8C959F; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #0D1117; stroke: #3D444D; }
      .box   { fill: #161B22; stroke: #6E7681; }
      .tbox  { fill: #0D1117; stroke: #E08A4B; }
      .h     { fill: #E6EDF3; }
      .s, .cond { fill: #9198A1; }
      .acc   { fill: #E08A4B; }
      .line  { stroke: #6E7681; }
      .head  { fill: #6E7681; }
      .ok    { fill: #3FB950; }
      .no    { fill: #6E7681; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="879" height="311" rx="12"/>

  <!-- function -->
  <rect class="box" x="24" y="118" width="150" height="64" rx="8"/>
  <text class="h" x="99" y="145" text-anchor="middle">A function</text>
  <text class="s" x="99" y="166" text-anchor="middle">in your map</text>
  <line class="line" x1="174" y1="150" x2="202" y2="150" marker-end="url(#ah)"/>

  <!-- keyword search -->
  <rect class="box" x="206" y="118" width="170" height="64" rx="8"/>
  <text class="h" x="291" y="145" text-anchor="middle">Keyword search</text>
  <text class="s" x="291" y="166" text-anchor="middle">picks 3 likely tests</text>
  <line class="line" x1="376" y1="150" x2="404" y2="150" marker-end="url(#ah)"/>

  <!-- Jev -->
  <rect class="tbox" x="408" y="118" width="184" height="64" rx="8"/>
  <text class="h acc" x="500" y="145" text-anchor="middle">Jev</text>
  <text class="s" x="500" y="166" text-anchor="middle">scores each pair, 0 to 1</text>

  <!-- two-way split -->
  <line class="line" x1="592" y1="150" x2="608" y2="150"/>
  <line class="line" x1="608" y1="72" x2="608" y2="228"/>
  <line class="line" x1="608" y1="72" x2="628" y2="72" marker-end="url(#ah)"/>
  <line class="line" x1="608" y1="228" x2="628" y2="228" marker-end="url(#ah)"/>

  <!-- yes -->
  <rect class="box" x="632" y="34" width="224" height="76" rx="8"/>
  <text class="cond" x="652" y="55">0.8 OR HIGHER</text>
  <circle class="ok" cx="662" cy="78" r="10"/>
  <path d="M657.5,78.5 l3.1,3.1 l5.8,-6.4" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="h" x="680" y="83">Added to the map</text>
  <text class="s" x="652" y="101">inferred link, with a receipt</text>

  <!-- no -->
  <rect class="box" x="632" y="190" width="224" height="76" rx="8"/>
  <text class="cond" x="652" y="211">UNDER 0.8</text>
  <circle class="no" cx="662" cy="234" r="10"/>
  <path d="M657,234 h10" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <text class="h" x="680" y="239">Not added</text>
  <text class="s" x="652" y="257">the test may still run it</text>

  <!-- footer -->
  <text class="s" x="24" y="292">Structural links come from reading the code. No model is called, and none of your code runs.</text>
</svg>
